services:
  - type: web
    name: update-tool-backend
    env: node
    plan: free
    buildCommand: cd server && npm ci --production=false
    startCommand: cd server && npm ci --production=false && npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://update-tool.onrender.com/auth/google/callback
        sync: false
      - key: CHAT_WEBHOOK_SPACE_DEVELOPMENT
        sync: false
      - key: CHAT_WEBHOOK_SPACE_DESIGN
        sync: false
      - key: CHAT_WEBHOOK_SPACE_MARKETING
        sync: false
      - key: CHAT_WEBHOOK_SPACE_SALES
        sync: false
      - key: CHAT_WEBHOOK_SPACE_CLIENT_SUCCESS
        sync: false
      - key: CHAT_WEBHOOK_SPACE_GENERAL
        sync: false
